# RecruitIQ - recruitiq.io
#
# Everything proxies to the Next.js standalone server on 3001; the browser
# never talks to FastAPI directly (Phase 3 design). FastAPI on 8020 is
# reached only server-side by Next via API_BASE_URL.
#
# certbot --nginx manages the 443 block and the HTTP->HTTPS redirect; this
# file is the pre-certbot state and certbot edits it in place on the droplet.

# Per-IP limits. The AI zone covers the two LLM-backed paths (resume parsing,
# assistant chat) that cost real money or GPU time; the general zone is scraper
# protection for everything else.
limit_req_zone $binary_remote_addr zone=recruitiq_all:2m rate=10r/s;
limit_req_zone $binary_remote_addr zone=recruitiq_ai:1m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name recruitiq.io www.recruitiq.io;

    # Must come before the limit_req below: behind Cloudflare $remote_addr is an
    # edge address, and both the rate-limit zones above and the parse quota in
    # the app key on the visitor. See the file for the full reasoning. Inert
    # while the domain resolves straight to this box.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Resume uploads
    client_max_body_size 10m;

    limit_req zone=recruitiq_all burst=30 nodelay;
    limit_req_status 429;

    location /api/assistant/ {
        limit_req zone=recruitiq_ai burst=6 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        # SSE stream: no buffering, generous read timeout
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/resume/ {
        limit_req zone=recruitiq_ai burst=6 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        # Parse can take a couple of LLM round trips
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
    }
}

# Legacy domain. The site was resumecupid.ai until 2026-08-30; the rename to
# recruitiq.io aligns the URL with the project name (ADR 0005).
#
# The redirect visitors actually hit is a Cloudflare Redirect Rule on the
# resumecupid.ai zone, which answers at the edge and never reaches this box.
# This block is the fallback: if that rule is ever removed or the zone is
# un-proxied, the old domain must still redirect rather than quietly serving a
# second copy of the app on the wrong name.
#
# 302 on purpose while the new domain settles. Promote BOTH this block and the
# Cloudflare rule to 301 together - a mismatch means the answer depends on
# which layer served it.
server {
    listen 80;
    listen [::]:80;
    server_name resumecupid.ai www.resumecupid.ai;

    return 302 https://recruitiq.io$request_uri;
}
