# Trust Cloudflare's edge and recover the visitor's real address.
#
# Installed on the droplet at /etc/nginx/snippets/cloudflare-realip.conf and
# included from resumecupid.ai's server block.
#
# Why this exists: once resumecupid.ai is proxied through Cloudflare, every
# request reaches this box from a Cloudflare edge IP, so $remote_addr no longer
# identifies the visitor. That breaks two things at once, both silently:
#
#   1. The limit_req zones key on $binary_remote_addr, so the 10r/s and 12r/m
#      budgets would be shared by the entire internet rather than per visitor.
#   2. backend/utils/parse_quota.py reads X-Real-IP, which /etc/nginx/proxy_params
#      fills from $remote_addr. The daily parse limit would be consumed globally
#      by whoever showed up first.
#
# The realip module runs at post-read, before limit_req is evaluated at
# preaccess, so rewriting $remote_addr here fixes both.
#
# Deliberately scoped to RecruitIQ's server block rather than dropped in
# conf.d/: this droplet also serves SentientTrader, and http-context directives
# would change its request handling too.
#
# Inert until traffic actually arrives from Cloudflare, since set_real_ip_from
# trusts only these ranges - so it is safe to install before the DNS cutover.
#
# Ranges from https://www.cloudflare.com/ips-v4 and ips-v6, fetched 2026-08-29.
# Refresh with scripts/update_cloudflare_ips.sh; Cloudflare changes them rarely
# but does change them.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# CF-Connecting-IP carries a single address, so real_ip_recursive is not needed.
# Preferred over X-Forwarded-For, which a client can forge; this header is set
# by Cloudflare itself and the set_real_ip_from list above is what makes
# trusting it safe.
real_ip_header CF-Connecting-IP;
