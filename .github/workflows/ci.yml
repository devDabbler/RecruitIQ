name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ats_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_CONN: postgresql://ci:ci@localhost:5432/ats_ci
      OLLAMA_BASE_URL: http://localhost:1  # unreachable on purpose: embedding fallback path in CI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (error-class rules)
        run: poetry run ruff check backend --select E9,F63,F7,F82 --exclude backend/tests

      - name: Migrate schema
        working-directory: backend
        run: poetry run alembic upgrade head

      # Fails the build when a route changes without a regenerated schema, so
      # backend/frontend drift shows up here rather than as a broken screen.
      - name: Check openapi.json is current
        run: poetry run python scripts/export_openapi.py --check

      - name: Test
        run: poetry run pytest -q

  # The Playwright journey is deliberately not here: it needs a seeded database
  # and real model credentials, so it would fail for reasons unrelated to the
  # diff. Run it locally with `npm run e2e`.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Catches a screen that references a field the generated types no longer
      # have — the drift the committed openapi.json is there to surface.
      - name: Build
        run: npm run build
