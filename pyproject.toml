[tool.poetry]
name = "recruiting-intelligence-platform"
version = "0.1.0"
description = "AI-powered recruiting intelligence dashboard"
authors = ["Your Name <your.email@example.com>"]
packages = [
    { include = "backend" }
]

[tool.poetry.dependencies]
python = "^3.11"
streamlit = "1.45.0"
fastapi = "0.112.0"
uvicorn = "^0.23.2"
thefuzz = {extras = ["speedup"], version = "^0.22.1"}
pydantic = "2.10.0"
httpx = "0.27.2"
redis = "5.0.1"
neo4j = "5.19.0"
minio = "7.2.0"
langchain = "0.1.0"
langchain-community = "0.0.20"
langchain-groq = "0.0.1"
google-generativeai = "0.5.0"
pandas = "2.2.0"
scipy = "1.12.0"
scikit-learn = "1.4.0"
transformers = "4.39.0"
sentence-transformers = "2.5.0"
python-dotenv = "1.0.1"
pytz = "2024.1"
email-validator = "2.1.1"
python-multipart = "0.0.9"
aiofiles = "24.1.0"
watchfiles = "0.22.0"
beautifulsoup4 = "4.12.3"
pypdf = "4.2.0"
docx2txt = "0.9"
tiktoken = "0.7.0"
sqlalchemy = "2.0.27"
psycopg2-binary = "2.9.9"
alembic = "1.13.1"
crawl4ai = "0.6.2"
spacy = "3.7.2"
html2text = "2024.2.26"
markdown = "3.5.2"
plotly = "6.0.1"
altair = "5.5.0"
requests = "2.32.3"
groq = "0.22.0"
PyPDF2 = "3.0.1"
fpdf = "1.7.2"
pyperclip = "1.9.0"
pdfplumber = "0.11.6"
cohere = "5.15.0"
rerankers = "0.9.1.post1"
aioredis = "2.0.1"
pydantic-settings = "2.9.1"
streamlit-authenticator = "^0.4.1"
bcrypt = "4.1.3"
matplotlib = "3.8.3"
numpy = "1.26.4"
pyyaml = "6.0.1"
pyparsing = "^3.2.3"
pytesseract = "^0.3.10"
pillow = "^10.1.0"
pdf2image = "^1.17.0"
reportlab = "^4.4.1"
easyocr = "^1.7.2"
torch-directml = "^0.2.5.dev240914"
python-dateutil = "^2.9.0.post0"
pylint = "^3.3.7"
streamlit-pdf-viewer = "^0.0.25"
mammoth = "^1.9.1"
python-docx = "^1.2.0"
pgvector = "^0.4.1"
python-memcached = "^1.59"
flake8 = "^7.3.0"
fuzzywuzzy = "^0.18.0"
python-levenshtein = "^0.25.0"

[tool.poetry.group.dev.dependencies]
black = "^24.2.0"
isort = "^5.13.2"
mypy = "^1.8.0"
ruff = "^0.2.2"
pre-commit = "^3.6.0"
pytest = "^8.3.5"
pytest-asyncio = "0.23.5"
pytest-cov = "^6.1.1"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 120
select = ["E", "F", "B", "I"]
ignore = ["E203", "E501"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"